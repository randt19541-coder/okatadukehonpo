<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="遺品整理で思い出の品を家族が丁寧に仕分けしているイラスト">
  <!-- 背景 -->
  <rect x="0" y="0" width="640" height="400" rx="24" fill="#FFF8EC"/>
  <rect x="0" y="0" width="640" height="400" rx="24" fill="none" stroke="#FFE2A8" stroke-width="2"/>

  <!-- 床のライン -->
  <line x1="60" y1="312" x2="580" y2="312" stroke="#EAD9BE" stroke-width="3" stroke-linecap="round"/>

  <!-- やさしい光（見守り） -->
  <circle cx="470" cy="120" r="70" fill="#FFF2CF"/>
  <g stroke="#FFD46A" stroke-width="4" stroke-linecap="round">
    <line x1="470" y1="30" x2="470" y2="52"/>
    <line x1="540" y1="55" x2="525" y2="70"/>
    <line x1="400" y1="55" x2="415" y2="70"/>
    <line x1="560" y1="120" x2="540" y2="120"/>
    <line x1="380" y1="120" x2="400" y2="120"/>
  </g>

  <!-- ハート（大切に思う気持ち） -->
  <path d="M470 148 c-14 -22 -46 -14 -46 12 c0 22 34 40 46 50 c12 -10 46 -28 46 -50 c0 -26 -32 -34 -46 -12 z"
        fill="#F4A0A0"/>
  <path d="M456 118 c-3 -5 -10 -3 -10 3 c0 5 7 9 10 11 c3 -2 10 -6 10 -11 c0 -6 -7 -8 -10 -3 z" fill="#fff" opacity=".7"/>

  <!-- ダンボール箱（本体） -->
  <g>
    <!-- 箱の側面 -->
    <path d="M120 200 L300 200 L288 312 L132 312 Z" fill="#D9A76C"/>
    <path d="M120 200 L210 200 L210 312 L132 312 Z" fill="#E0B27A"/>
    <!-- 箱の上フラップ（開いている） -->
    <path d="M120 200 L210 178 L120 156 L60 178 Z" fill="#C99459"/>
    <path d="M300 200 L210 178 L300 156 L360 178 Z" fill="#C99459"/>
    <path d="M120 200 L210 178 L300 200 L210 214 Z" fill="#B9854C"/>
    <!-- ラベル -->
    <rect x="150" y="238" width="90" height="34" rx="4" fill="#FFF7E6"/>
    <line x1="160" y1="250" x2="230" y2="250" stroke="#C99459" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="262" x2="212" y2="262" stroke="#D9A76C" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 箱の中／横の思い出の品 -->
  <!-- 写真立て -->
  <g>
    <rect x="212" y="120" width="86" height="72" rx="6" fill="#1565C0"/>
    <rect x="222" y="130" width="66" height="52" rx="3" fill="#EAF3FF"/>
    <circle cx="255" cy="150" r="11" fill="#FFCC80"/>
    <path d="M238 178 c0 -12 34 -12 34 0 z" fill="#90A4AE"/>
    <rect x="248" y="192" width="14" height="10" fill="#0D4C99"/>
  </g>

  <!-- 本の重なり -->
  <g>
    <rect x="316" y="270" width="96" height="14" rx="2" fill="#7FB2E5"/>
    <rect x="322" y="256" width="96" height="14" rx="2" fill="#F4C04E"/>
    <rect x="316" y="242" width="96" height="14" rx="2" fill="#E58A8A"/>
  </g>

  <!-- 掛け時計 -->
  <g>
    <circle cx="360" cy="150" r="34" fill="#fff" stroke="#C9B79A" stroke-width="5"/>
    <line x1="360" y1="150" x2="360" y2="130" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
    <line x1="360" y1="150" x2="376" y2="158" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
    <circle cx="360" cy="150" r="4" fill="#5D4037"/>
  </g>

  <!-- 書類の束（貴重品・書類） -->
  <g>
    <rect x="430" y="262" width="120" height="50" rx="4" fill="#fff" stroke="#DcCDB2" stroke-width="2" transform="rotate(-6 490 287)"/>
    <rect x="438" y="256" width="120" height="50" rx="4" fill="#fff" stroke="#DcCDB2" stroke-width="2" transform="rotate(3 498 281)"/>
    <line x1="452" y1="272" x2="540" y2="272" stroke="#B7C9DF" stroke-width="3" stroke-linecap="round"/>
    <line x1="452" y1="284" x2="524" y2="284" stroke="#DDE4EC" stroke-width="3" stroke-linecap="round"/>
    <line x1="452" y1="296" x2="536" y2="296" stroke="#DDE4EC" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- そっと添える手 -->
  <path d="M96 300 q-26 -6 -34 8 q-4 8 6 12 q22 8 40 2 q10 -4 6 -14 z" fill="#FFCC80"/>
</svg>
